---
# Builds the custom CLIProxyAPI image with the quota and auth plugins baked in,
# and publishes it to ghcr.io. See issue #10 for why a baked image is required:
# the live plugin directory is the container's ephemeral writable layer, so
# anything copied in at runtime is lost when the pod is replaced.
#
# The published digest is what k8s-conf/apps/cliproxyapi/release.yaml pins.
name: image

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/image.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cliproxy-api-with-plugins

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # verify-upstream asserts against the pinned submodule, so it must be
      # checked out. The image build itself does not need it -- the ABI types
      # are hand-copied into this repo.
      - uses: actions/checkout@v4
        with:
          submodules: true
          # verify-upstream resolves the compat tag with
          # `git rev-list -n 1 v7.2.61` inside the submodule. The default
          # shallow clone fetches no tags, so that resolution fails with
          # "unknown revision". Full history is required for the submodule,
          # which fetch-depth: 0 propagates to.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Gate the image on both. verify-upstream only greps for method-name
      # presence against the pin, so passing it does not prove compatibility
      # with the deployed CPA version -- see docs/tracer-bullet-findings.md.
      - run: make verify-upstream
      - run: make test

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what goes into the HelmRelease. Surface it in the job
      # summary so the k8s-conf change does not require digging through logs
      # or a registry round-trip.
      - name: Report digest for k8s-conf pin
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Pin this in `k8s-conf/apps/cliproxyapi/release.yaml`'
            echo
            echo '```yaml'
            echo 'image:'
            echo "  repository: ${REGISTRY}/${IMAGE_NAME}"
            echo "  tag: ${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
